[project]
name = "discord2drive"
version = "0.1.0"
description = "Export Discord thread transcripts to Google Drive"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.196.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "requests>=2.34.2",
]

[tool.setuptools]
py-modules = ["main", "config", "discord_client", "formatter", "drive_client"]

[project.scripts]
discord2drive = "main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-httpx>=0.36.2",
]
